name: Tests and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Functions has its own manifest but no lockfile. Install it separately
      # so extraction tests exercise the same dependency boundary as deployment.
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build

  # Fletter Dependabot-PR-er automatisk når CI er grønn, men bare minor- og
  # patch-oppdateringer. Major-hopp blir liggende for manuell testing.
  # Flettes direkte i stedet for med "gh pr merge --auto", slik at det ikke
  # krever branch protection eller "Allow auto-merge" i repoet.
  dependabot-fletting:
    needs: test-build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
