[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # jsdom 30 krever Node ^22.22.2 || ^24.15.0
  NODE_VERSION = "22"

[functions]
  directory = "functions"

[dev]
  command = "npm run dev"
  port = 9000
  targetPort = 5173
  autoLaunch = false

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/api/extract"
  to = "/.netlify/functions/extract"
  status = 200

[[redirects]]
  from = "/api/summarize"
  to = "/.netlify/functions/summarize"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
